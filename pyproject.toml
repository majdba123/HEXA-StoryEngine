[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hexa-story-engine"
version = "0.1.0"
description = "HEXA story-driven video generation engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<12",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
transcription = ["faster-whisper>=1.1,<2"]
vision = ["torch>=2.4", "transformers>=4.45,<5", "accelerate>=0.34"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
hexa = "app.cli:main"
hexa-desktop = "app.desktop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
