name: V2 CI

on:
  push:
    branches:
      - main
      - bayer
      - majd
      - montage
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y ffmpeg
      - name: Install StoryEngine
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Lint
        run: ruff check app tests
      - name: Test1 canonical compatibility and Unified 2.0 contract lock
        run: pytest tests/test1
      - name: Test2 layer contracts, semantic carriers and encoded smoke
        run: pytest tests/test2
      - name: Test3 package-shaped generative matrix and stress
        run: pytest tests/test3
      - name: Acceptance certification (semantic carrier assignment/resolver/generated/mutation, alignment text)
        run: pytest tests/certification
      - name: Upload tested source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexa-storyengine-source-${{ github.sha }}
          path: |
            app
            tests
            pyproject.toml
            README.md
            HEXA.bat
          if-no-files-found: error
          retention-days: 7


  package-holdouts:
    # Sprint 3.75 certification gate: every generated Unified 2.0 package holdout
    # (structural, encoded FFmpeg, full muxed renders, opening coverage) on the exact
    # pushed HEAD. Runs in parallel with the core suites; it is never optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y ffmpeg
      - name: Install StoryEngine
        run: python -m pip install -e ".[dev]"
      - name: Sprint 3.75 package holdouts (exact count, no skips)
        run: >
          pytest -rfEs --junitxml=package-holdouts.xml tests/package_holdouts
          && python -m tests.package_holdouts.report require package-holdouts.xml

  visual-gates:
    # Permanent visual architecture gates, including Roadmap V2 Sprint 1: every
    # target-sensitive check parameterizes over SUPPORTED_VISUAL_TARGETS, so a change to
    # any shared visual layer is exercised against YouTube 16:9 and Reels 9:16 here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y ffmpeg
      - name: Install StoryEngine
        run: python -m pip install -e ".[dev]"
      - name: Visual gates (all supported output formats)
        run: pytest -rfEs tests/visual

  encoded-render-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version
      - name: Install StoryEngine
        run: python -m pip install -e ".[dev]"
      - name: Full-HD encoded render contract gate
        run: >
          pytest -q
          tests/test2/render/test_encoded_motion_regressions.py
          tests/test2/render/test_package_shaped_encoded_render.py
          tests/test2/integration/test_layer_handoff_motion_contracts.py
          tests/test2/text/test_text_v2.py
          tests/test2/text/test_text_mixed_script.py
