name: V2 CI

on:
  push:
    branches:
      - main
      - bayer
      - majd
      - montage
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install StoryEngine
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Lint
        run: ruff check app tests
      - name: Test1 canonical compatibility
        run: pytest tests/test1
      - name: Test
        run: pytest
      - name: Upload tested source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexa-storyengine-source-${{ github.sha }}
          path: |
            app
            tests
            pyproject.toml
            README.md
            HEXA.bat
          if-no-files-found: error
          retention-days: 7


  encoded-render-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version
      - name: Install StoryEngine
        run: python -m pip install -e ".[dev]"
      - name: Full-HD encoded render contract gate
        run: >
          pytest -q
          tests/test2/render/test_encoded_motion_regressions.py
          tests/test2/integration/test_layer_handoff_motion_contracts.py
