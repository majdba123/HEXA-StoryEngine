name: Visual Storytelling V1 Branch Validation

on:
  push:
    branches:
      - feature/visual-storytelling-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar-and-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile code
        run: python -m compileall -q app
      - name: Ruff
        run: ruff check app tests
      - name: Sidecar validation and isolation
        run: python -m pytest -q tests/visual/test_visual_storytelling_v1.py
      - name: Legacy and visual regressions
        run: python -m pytest -q tests/test1 tests/test2 tests/visual tests/web
