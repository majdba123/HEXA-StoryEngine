name: S01 and S02 Cinematic Flow - Independent Verification

on:
  push:
    branches:
      - feature/storytelling-sprints

permissions:
  contents: read

concurrency:
  group: visual-sprints-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-encoded:
    if: github.ref == 'refs/heads/feature/storytelling-sprints'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated sprint branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Static quality
        run: |
          python -m compileall -q app
          ruff check app tests
      - name: S01 motion, pipeline and encoded A-B regressions
        run: >
          python -m pytest -q -rfEs
          tests/test2/motion/test_cross_scene_continuity.py
          tests/test2/pipeline/test_cross_scene_transaction.py
          tests/test2/render/test_cross_scene_handoff_encoded.py
          tests/test2/render/test_renderer_handoff_continuity.py
          tests/test2/motion/test_continuity_contracts.py
          tests/test2/render/test_transition_regressions.py
      - name: S02 directional entrances, exits, mass blur and encoded vertical
        run: >
          python -m pytest -q -rfEs
          tests/test2/motion/test_scene_flow_s02.py
          tests/test2/render/test_motion_blur.py
          tests/visual/test_vp4_hero_exit.py
          tests/visual/test_visual_sprint_vertical_slides.py
      - name: Causal relationship regression
        run: >
          python -m pytest -q -rfEs
          tests/visual/test_causal_overlap_read_hold.py
          tests/visual/test_sprint_4_2_semantic_relationship_flow.py
          tests/visual/test_sprint_5_completed_state_hold.py
      - name: Broad visual and layer regression
        run: python -m pytest -q -rfEs tests/visual tests/test2
      - name: Final Package backward compatibility and holdouts
        run: python -m pytest -q -rfEs tests/test1 tests/package_holdouts
      - name: Report execution limits
        if: always()
        run: |
          echo '## S01 and S02 independent GitHub verification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Includes focused S02 cardinal direction, mass blur and encoded exit regressions.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Does not certify a real Black Hat package+audio render; requires local acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Isolated branch only; no deployment or merge.' >> "$GITHUB_STEP_SUMMARY"
