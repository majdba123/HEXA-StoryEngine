name: HEXA CI/CD (Bayer)

# One push on bayer -> one Linux job -> all mandatory gates -> safe VPS deploy.
# Never run GitHub CI/CD on montage pushes.
on:
  push:
    branches: [bayer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexa-production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/bayer'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 150
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and FFprobe
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y ffmpeg
          ffmpeg -version | sed -n '1p'

      - name: Install HEXA and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile source and lint
        run: |
          python -m compileall -q app
          ruff check app tests

      - name: Web UI, API, upload and deployment regression tests
        run: pytest tests/web

      - name: Unified Final Package compatibility - Test1
        run: pytest tests/test1

      - name: FFmpeg encoded and layer-contract tests - Test2
        run: pytest tests/test2

      - name: Generative package and stress tests - Test3
        run: pytest tests/test3

      - name: Semantic and alignment certification tests
        run: pytest tests/certification

      - name: Package holdouts - mandatory no-skips
        run: |
          pytest -rfEs --junitxml=package-holdouts.xml tests/package_holdouts
          python -m tests.package_holdouts.report require package-holdouts.xml

      - name: YouTube and Reels visual quality gates
        run: pytest -rfEs tests/visual

      - name: Provision and fingerprint all six real packages
        env:
          CORPUS_URL: ${{ vars.HEXA_REAL_PACKAGE_CORPUS_URL }}
          HEXA_REAL_PACKAGE_CORPUS_TOKEN: ${{ secrets.HEXA_REAL_PACKAGE_CORPUS_TOKEN }}
          HEXA_REQUIRE_REAL_PACKAGE_CORPUS: "1"
          HEXA_REAL_PACKAGE_CORPUS: ${{ github.workspace }}/.real-corpus
        run: |
          set -euo pipefail
          if [[ -z "$CORPUS_URL" ]]; then
            echo "::error::HEXA_REAL_PACKAGE_CORPUS_URL missing; deployment blocked"
            exit 1
          fi
          python -m tests.support.real_corpus fetch "$CORPUS_URL" "$HEXA_REAL_PACKAGE_CORPUS"

      - name: Real packages Level A - structure
        env:
          HEXA_REQUIRE_REAL_PACKAGE_CORPUS: "1"
          HEXA_REAL_PACKAGE_CORPUS: ${{ github.workspace }}/.real-corpus
        run: |
          pytest -rfEs --junitxml=level-a.xml \
            -k "level_a or real_corrected_package_corpus or zero_relations or typed_semantic_linkage" \
            tests/test1/certification/test_real_package_tiers.py \
            tests/test1/certification/test_real_package_structures.py
          python -m tests.support.real_corpus require-executed level-a.xml

      - name: Real packages Level B - semantics
        env:
          HEXA_REQUIRE_REAL_PACKAGE_CORPUS: "1"
          HEXA_REAL_PACKAGE_CORPUS: ${{ github.workspace }}/.real-corpus
        run: |
          pytest -rfEs --junitxml=level-b.xml -k "level_b" \
            tests/test1/certification/test_real_package_tiers.py
          python -m tests.support.real_corpus require-executed level-b.xml

      - name: Real packages Levels C-D - render planning
        env:
          HEXA_REQUIRE_REAL_PACKAGE_CORPUS: "1"
          HEXA_REAL_PACKAGE_CORPUS: ${{ github.workspace }}/.real-corpus
        run: |
          pytest -rfEs --junitxml=level-cd.xml -k "level_c_d or reaches_render_plan" \
            tests/test1/certification/test_real_package_tiers.py \
            tests/test1/certification/test_real_package_planning.py
          python -m tests.support.real_corpus require-executed level-cd.xml

      - name: Verify latest bayer SHA and deployment switch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_DEPLOY: ${{ vars.HEXA_AUTO_DEPLOY }}
        run: |
          set -euo pipefail
          if [[ "$AUTO_DEPLOY" != "true" ]]; then
            echo "::error::HEXA_AUTO_DEPLOY must be true; no deployment"
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/bayer" --jq '.object.sha')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::warning::Obsolete commit $GITHUB_SHA; latest bayer is $latest; skip deploy"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "RELEASE_CERTIFIED: $GITHUB_SHA"
          {
            echo "### HEXA production verification"
            echo "- SHA: $GITHUB_SHA"
            echo "- Core, encoded FFmpeg, holdouts and visual checks: PASS"
            echo "- Six real Final Packages A-D: PASS"
            echo "- Level E: NOT EXECUTED"
            echo "- Dedicated Windows runner: NOT EXECUTED (manual-only)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy certified SHA to VPS through restricted SSH
        if: steps.release.outputs.eligible == 'true'
        env:
          DEPLOY_HOST: ${{ vars.HEXA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.HEXA_DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.HEXA_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HEXA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || {
            echo "::error::Missing deploy configuration"
            exit 1
          }
          [[ "$DEPLOY_HOST" =~ ^[0-9A-Za-z.:-]+$ ]] || exit 1
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hexa_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/hexa_key" >/dev/null
          ssh -i "$HOME/.ssh/hexa_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "hexa-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
