name: Activate approved visual baseline

on:
  push:
    branches:
      - chatgpt/montage6-v2-bootstrap

permissions:
  contents: write

jobs:
  activate:
    if: contains(github.event.head_commit.message, '[activate-approved-baseline]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Extract and verify exact approved source tree
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf docs/accepted-baselines/approved-20s-source.tar.gz -C "$tmp"
          verify() {
            local expected="$1"
            local path="$2"
            local actual
            actual="$(git hash-object "$tmp/$path")"
            if [ "$actual" != "$expected" ]; then
              echo "approved source mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          }
          verify 34bde83c2ad6e42750aef0de78b4865a986df91d app/composition/planner.py
          verify bd648fba10f76c1dd29946ef363d83a0a4b21e82 app/cutout/service.py
          verify 0726f33587b86d60e69e90458f3af5372ebde57c app/input/loader.py
          verify db100ed489df6d77c2c787c85c623c97d17f6c07 app/models.py
          verify 3f627c698ea634efacd12a611c413467433cfd6f app/motion/planner.py
          verify c79e88cc6ae224fa7906a098f7be55e0ef456aa4 app/pipeline.py
          verify d8316574d796e30ff387ae1df109bb623b07646b app/recovery/builtins.py
          verify 6827bbb230105b9075a6ccdba40b8533395cef80 app/recovery/detector.py
          verify c33622b77d2c39ccf70f4c2928faa133d6c933df app/render/renderer.py
          verify cea247bc5f829bb1fc96c5874bb1a8862240b285 app/story/planner.py
          verify 489e940212bdb6c1bef2bb682d07a69d0ac780e7 app/transcription/service.py
          verify a9e80c1169968ffb2899faf4a36340265c4e0768 app/vision/service.py
          verify 0d3d7911d3c0c1941b22b67d61e44fe7ea51ac47 pyproject.toml
          verify 57801b45feea38567c21705ddb69d1c1c92b7aa0 tests/test_scene_plan_timing.py
          verify 5855655a01127eff31f913f2e43e360539bd4656 tests/test_vision_cutout.py
          echo "APPROVED_SOURCE_TREE_VERIFIED"
          echo "APPROVED_TMP=$tmp" >> "$GITHUB_ENV"
      - name: Activate exact approved source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app tests
          cp -a "$APPROVED_TMP/app" ./app
          cp -a "$APPROVED_TMP/tests" ./tests
          cp "$APPROVED_TMP/pyproject.toml" ./pyproject.toml
          cp "$APPROVED_TMP/HEXA.bat" ./HEXA.bat
          cp "$APPROVED_TMP/README.md" ./README.md
          rm -f .github/workflows/activate-approved-baseline.yml
      - name: Test exact baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q app tests
          ruff check app tests
          pytest
      - name: Commit approved baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m '[montage6] Activate approved visual baseline'
          git push origin HEAD:chatgpt/montage6-v2-bootstrap
