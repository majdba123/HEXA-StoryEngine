name: HEXA Admin Feature Validation

# Isolated montage verification. No production environment, SSH, or deployment secrets.
on:
  push:
    branches: [montage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexa-montage-validation
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/montage'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout isolated feature commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 update
            sudo apt-get -o Acquire::Retries=1 install -y ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Install dependencies
        run: python -m pip install -e ".[dev,desktop]"
      - name: Verify headless Qt runtime
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -F 'libEGL.so.1' >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 install -y libegl1
          fi
          QT_QPA_PLATFORM=offscreen python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtTest import QTest"
      - name: Compile and lint
        run: |
          python -m compileall -q app
          ruff check app tests
          node --check app/web/static/app.js
          node --check app/web/static/admin.js
          node --check app/web/static/login.js
          node --check app/web/static/change-password.js
      - name: Web, identity, security, exports and upload regressions
        run: pytest -rfEs tests/web
      - name: Final Package compatibility
        run: pytest -rfEs tests/test1
      - name: FFmpeg encoded and layer contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -rfEs tests/test2
      - name: Generative and stress tests
        run: pytest -rfEs tests/test3
      - name: Alignment certification
        run: pytest -rfEs tests/certification
      - name: Mandatory package holdout tests
        run: |
          pytest -rfEs --junitxml=admin-package-holdouts.xml tests/package_holdouts
          python -m tests.package_holdouts.report require admin-package-holdouts.xml
      - name: Visual quality regressions
        run: pytest -rfEs tests/visual
