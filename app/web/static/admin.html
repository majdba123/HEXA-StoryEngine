<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة HEXA StoryEngine</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/admin.css"></head>
<body><main class="admin"><header><h1>لوحة إدارة HEXA</h1><nav><a href="/">أداة التوليد</a><button id="logout">تسجيل الخروج</button></nav></header>
<nav class="tabs" aria-label="صفحات الإدارة"><button data-tab="overview">الرئيسية</button><button data-tab="users">إدارة المستخدمين</button><button data-tab="exports">إدارة الفيديو</button><button data-tab="history">إحصاءات الفيديو</button><button data-tab="account">أمان الحساب</button></nav><p id="message" role="status"></p>
<section id="overview"><h2>نظرة عامة</h2><div id="cards" class="cards"></div></section>
<section id="users" hidden><h2>المستخدمون</h2><form id="create-user" class="stack"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة مرور مؤقتة<input name="password" type="password" minlength="12" required></label><label>الدور<select name="role"><option>USER</option><option>ADMIN</option></select></label><button>إضافة مستخدم</button></form><div class="toolbar"><input id="user-search" placeholder="بحث بالبريد الإلكتروني"><button id="user-refresh">بحث</button></div><div class="table-wrap"><table><thead><tr><th>البريد الإلكتروني</th><th>الدور</th><th>الحالة</th><th>آخر دخول</th><th>الإجراءات</th></tr></thead><tbody id="user-rows"></tbody></table></div><button id="users-more">التالي</button></section>
<section id="exports" hidden><h2>الفيديوهات</h2><div class="toolbar"><input id="export-search" placeholder="بحث باسم الحزمة"><button id="export-refresh">بحث</button></div><div class="table-wrap"><table><thead><tr><th>الحزمة</th><th>الإصدار</th><th>تاريخ التوليد</th><th>الحالة</th><th>YouTube</th><th>Reels</th><th>الحجم</th><th>الإجراءات</th></tr></thead><tbody id="export-rows"></tbody></table></div><button id="exports-more">التالي</button></section>
<section id="history" hidden><h2>سجل التوليد</h2><div class="toolbar"><input id="history-search" placeholder="بحث بالمهمة أو الحزمة"><select id="history-state"><option value="">كل الحالات</option><option>completed</option><option>failed</option><option>running</option><option>queued</option><option>canceled</option></select><input id="history-from" type="date" aria-label="من تاريخ"><input id="history-to" type="date" aria-label="إلى تاريخ"><select id="history-sort" aria-label="ترتيب"><option value="newest">الأحدث</option><option value="oldest">الأقدم</option></select><button id="history-refresh">بحث</button></div><p id="history-totals"></p><div class="table-wrap"><table><thead><tr><th>الحزمة</th><th>الإصدار</th><th>المهمة</th><th>الحالة</th><th>تاريخ الإرسال</th><th>المدة</th><th>المستخدم</th><th>الوسائط</th></tr></thead><tbody id="history-rows"></tbody></table></div><button id="history-more">التالي</button></section>
<section id="account" hidden><h2>تغيير كلمة المرور</h2><form id="change-password" class="stack"><label>كلمة المرور الحالية<input name="old_password" type="password" required></label><label>كلمة المرور الجديدة<input name="new_password" type="password" minlength="12" required></label><button>حفظ</button></form></section>
</main><script src="/static/admin.js" defer></script></body></html>
