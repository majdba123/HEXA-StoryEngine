<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تغيير كلمة المرور | HEXA</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login"><h1>تغيير كلمة المرور</h1><p>غيّر كلمة المرور المؤقتة قبل استخدام أداة التوليد.</p><form id="change"><div class="field"><label for="old">كلمة المرور الحالية</label><input id="old" type="password" autocomplete="current-password" required></div><div class="field"><label for="new">كلمة المرور الجديدة</label><input id="new" type="password" autocomplete="new-password" minlength="12" required></div><button>حفظ</button></form><p id="message" role="alert"></p></main><script src="/static/change-password.js" defer></script></body></html>
