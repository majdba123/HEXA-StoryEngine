<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEXA StoryEngine</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><h1>HEXA StoryEngine</h1><p>اختر الـ Final Package والصوت، ثم ولّد الفيديو.</p></header>
<form id="form"><div class="field"><label for="package">Final Package</label><input id="package" type="file" accept=".zip"><small id="package-name">اختيار ZIP</small></div>
<div class="field"><label for="folder">مجلد Final Package</label><input id="folder" type="file" webkitdirectory multiple><small id="folder-name">اختيار مجلد حيث يدعم المتصفح</small></div>
<div class="field"><label for="audio">الصوت</label><input id="audio" type="file" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg" required><small id="audio-name">اختيار ملف صوت</small></div>
<div class="actions"><button id="generate" type="submit">توليد YouTube + Reels</button><button id="cancel" type="button" disabled>إلغاء</button></div></form>
<progress id="progress" max="100" value="0"></progress><p id="status" role="status">جاهز</p>
<section><div class="heading"><h2>لوحة السجل</h2><button id="clear" type="button">مسح اللوحة</button></div><pre id="log" aria-live="polite"></pre></section>
<nav id="results" hidden><a id="youtube">تنزيل YouTube</a><a id="reels">تنزيل Reels</a><a id="manifest">ملف النتيجة</a><a id="diagnostics">استخراج تقرير التشخيص</a></nav><p id="export-path" dir="ltr"></p></main>
<script src="/static/app.js" defer></script></body></html>
